
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030712">
    <title>Forgot Password | Nexus</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
            background: radial-gradient(
                circle at top,
                #172554,
                #030712 70%
            );
            perspective: 1000px;
        }

        .glow {
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f5ff, #7c3aed);
            filter: blur(100px);
            opacity: 0.4;
            pointer-events: none;
            animation: float 7s ease-in-out infinite alternate;
        }

        @keyframes float {
            from {
                transform: translate(-120px, -80px);
            }
            to {
                transform: translate(120px, 80px);
            }
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border: 1px solid rgba(0, 245, 255, 0.4);
            border-radius: 24px;
            background: rgba(10, 18, 40, 0.8);
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 35px rgba(0, 245, 255, 0.15),
                inset 0 0 20px rgba(124, 58, 237, 0.08);
            transform-style: preserve-3d;
            transition: transform 0.15s ease;
        }

        .icon {
            display: grid;
            place-items: center;
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            border: 1px solid #00f5ff;
            border-radius: 22px;
            color: #00f5ff;
            font-size: 34px;
            box-shadow: 0 0 25px rgba(0, 245, 255, 0.25);
            transform: translateZ(25px);
        }

        h1 {
            margin-bottom: 12px;
            text-align: center;
            font-size: 28px;
            letter-spacing: 1px;
            transform: translateZ(20px);
        }

        .description {
            margin-bottom: 30px;
            color: #a5b4fc;
            font-size: 14px;
            line-height: 1.7;
            text-align: center;
        }

        .form-group {
            margin-bottom: 22px;
            transform: translateZ(15px);
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #263852;
            border-radius: 10px;
            outline: none;
            background: rgba(3, 7, 18, 0.8);
            color: white;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #00f5ff;
            box-shadow: 0 0 14px rgba(0, 245, 255, 0.2);
        }

        input::placeholder {
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #00f5ff, #a78bfa);
            color: #030712;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            transform: translateZ(20px);
        }

        button:hover {
            box-shadow: 0 0 25px rgba(0, 245, 255, 0.4);
            transform: translateZ(30px) scale(1.02);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .message {
            margin-top: 18px;
            min-height: 20px;
            color: #67e8f9;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }

        .back-link {
            display: block;
            margin-top: 24px;
            color: #00f5ff;
            font-size: 13px;
            text-align: center;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .footer {
            position: fixed;
            bottom: 16px;
            color: #64748b;
            font-size: 10px;
            letter-spacing: 2px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="glow" aria-hidden="true"></div>

    <main class="card" id="card">
        <div class="icon" aria-hidden="true">✦</div>

        <h1>RESET PASSWORD</h1>

        <p class="description">
            Lost access to your account?
            Enter your registered email address to begin
            the password recovery process.
        </p>

        <form id="resetForm">
            <div class="form-group">
                <label for="email">REGISTERED EMAIL ADDRESS</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    maxlength="254"
                    required
                >
            </div>

            <button type="submit" id="resetButton">
                SEND RESET INSTRUCTIONS →
            </button>

            <p
                class="message"
                id="message"
                role="status"
                aria-live="polite"
            ></p>
        </form>

        <a class="back-link" href="./index.html">
            ← Back to Login
        </a>
    </main>

    <div class="footer">
        N E X U S // SECURE ACCESS
    </div>

    <script>
        const card = document.getElementById("card");
        const form = document.getElementById("resetForm");
        const email = document.getElementById("email");
        const button = document.getElementById("resetButton");
        const message = document.getElementById("message");

        // Interactive 3D card effect
        document.addEventListener("mousemove", (event) => {
            if (
                window.matchMedia(
                    "(prefers-reduced-motion: reduce)"
                ).matches
            ) {
                return;
            }

            const x = (window.innerWidth / 2 - event.clientX) / 55;
            const y = (window.innerHeight / 2 - event.clientY) / 55;

            card.style.transform =
                `rotateY(${-x}deg) rotateX(${y}deg)`;
        });

        document.addEventListener("mouseleave", () => {
            card.style.transform = "rotateY(0deg) rotateX(0deg)";
        });

        // Demo-only form submission
        form.addEventListener("submit", (event) => {
            event.preventDefault();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Do not claim an email was sent:
            // a backend integration is required.
            message.textContent =
                "Demo only: connect a secure password recovery service to send instructions.";
        });
    </script>
</body>
</html>
